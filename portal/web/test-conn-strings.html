<!DOCTYPE html>
<html>
<head>
    <title>Test Connection Strings</title>
</head>
<body>
    <h1>Testing Connection Strings for Product: b1808c08-39e0-47b0-bd5e-40fee9a85b4b</h1>
    <div id="result">Loading...</div>
    
    <script>
        const productId = 'b1808c08-39e0-47b0-bd5e-40fee9a85b4b';
        
        console.log('Starting to load connection strings for:', productId);
        
        fetch(`http://localhost:7002/Home/GetConnectionStrings?productId=${productId}`)
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.text();
            })
            .then(text => {
                console.log('Raw response:', text);
                document.getElementById('result').innerHTML = `
                    <h2>Raw Response:</h2>
                    <pre>${text}</pre>
                `;
                
                try {
                    const data = JSON.parse(text);
                    console.log('Parsed data:', data);
                    document.getElementById('result').innerHTML += `
                        <h2>Parsed Data (${data.length} items):</h2>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } catch (e) {
                    console.error('JSON parse error:', e);
                    document.getElementById('result').innerHTML += `
                        <h2>Parse Error:</h2>
                        <pre>${e.message}</pre>
                    `;
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                document.getElementById('result').innerHTML = `
                    <h2>Fetch Error:</h2>
                    <pre>${error.message}</pre>
                `;
            });
    </script>
</body>
</html>
